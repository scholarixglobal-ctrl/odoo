[options]
; Core DB connection
admin_passwd = admin123
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_sslmode = disable

; HTTP
http_port = 8069
proxy_mode = True
dbfilter = ^SGCTECHAI$
list_db = False

; Addons paths - using core Odoo addons and CybroAddons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/CybroAddons,/mnt/custom-addons

; Logging
logfile = /dev/stdout
log_level = info

; Resource limits (tune as needed)
limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 2684354560
limit_memory_hard = 3221225472
